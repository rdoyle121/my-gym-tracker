function renderExerciseMedia(name,compact=false){const tips=exerciseTips(name),cat=categoryForExercise(name);return `<div class="exercise-media ${compact?'compact':''}"><img class="exercise-thumb" src="${imageSrcForExercise(name)}" alt="${esc(name)} exercise and muscle-group guide"><div class="exercise-guide"><div><b>${esc(name)}</b></div><div class="tag">${esc(cat)} guide</div><ul>${tips.slice(0,compact?2:3).map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));let html=tab==='today'?renderToday():tab==='workout'?renderWorkout():tab==='progress'?renderProgress():tab==='food'?renderFood():renderSettings();document.getElementById('app').innerHTML=html;if(tab==='progress')drawGraph();if(tab==='workout')bindWorkout();}
function renderToday(){const d=PLAN.days.find(x=>x.day===weekdays[new Date().getDay()]);const all=state.logs.filter(x=>x.done);const sessions=new Set(all.map(x=>x.date+'-'+x.day)).size;const volume=all.reduce((s,x)=>s+(Number(x.weight)||0)*(Number(x.reps)||0),0);const prs=new Set(all.map(x=>x.exercise)).size;return `<section class="card hero"><div class="today-hero-photo" style="background-image:linear-gradient(90deg,#140b10 0%,rgba(20,11,16,.84) 48%,rgba(20,11,16,.05) 100%),url(assets/shoulders.png)"></div><div class="today-hero-content"><div class="pill">${esc(new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'}))}</div><h2 style="margin-top:12px">${d?esc(d.title):'Recovery day 🌿'}</h2><p class="muted">${d?`Scheduled workout: ${esc(d.time)} · ${exercisesFor(d).length} exercises`:'Saturday & Sunday are rest days. Optional easy walk: 30–45 min.'}</p><button class="primary full" onclick="${d?`pickDay('${d.day}')`:`setTab('food')`}">${d?'▶ Start today’s workout →':'See today’s food plan →'}</button></div></section><div class="grid"><div class="stat"><small>Logged sessions</small><b>${sessions}</b></div><div class="stat"><small>Completed sets</small><b>${all.length}</b></div><div class="stat"><small>Total volume (kg)</small><b>${fmt(volume)}</b></div><div class="stat"><small>Exercises logged</small><b>${prs}</b></div></div><section class="card"><h3>Weekly plan</h3>${PLAN.days.map(d=>`<div class="row meal"><div><b>${esc(d.day)}</b><div class="muted tiny">${esc(d.title)}</div></div><button class="secondary" onclick="pickDay('${d.day}')">Open</button></div>`).join('')}<p class="muted tiny">Weekend: rest / optional walking</p></section><div class="card notice">Your progress stays on this device. Use <b>More → Export backup</b> regularly to avoid losing your logs if browser data is cleared.</div>`}
function pickDay(d){state.selectedDay=d;save();edit={};pickerOpen=false;openExercise=0;setTab('workout')}
function getSet(ex,i){let key=day().day+'|'+ex.name+'|'+i;let done=logsFor(window.workDate||today(),day().day).find(l=>l.exercise===ex.name&&l.set===i);let prev=state.logs.filter(l=>l.exercise===ex.name&&l.set===i&&l.date!==(window.workDate||today())&&l.done).sort((a,b)=>b.date.localeCompare(a.date))[0];return {key,done,prev,values:edit[key]||done||prev||{weight:'',reps:''}}}
function renderWorkout(){const d=day();const heroImg=imageSrcForExercise(d.exercises[0]?.name||d.title);const active=timerEnd>Date.now();return `<section class="card workout-hero"><div class="hero-inner"><img src="${heroImg}" alt="${esc(d.title)}"><div><div class="tiny muted">Today's workout</div><h2>${esc(d.title)}</h2><div class="workout-meta"><span>🏋️ ${d.exercises.length} exercises</span><span>⏱ ${esc(d.time||'~60 min')}</span></div></div></div></section><section class="card"><label>Workout date</label><input id="workdate" type="date" class="field" value="${esc(window.workDate||today())}" onchange="window.workDate=this.value;render()"><div class="days">${PLAN.days.map(x=>`<button class="daybtn ${d.day===x.day?'selected':''}" onclick="pickDay('${x.day}')">${x.day.slice(0,3)}</button>`).join('')}</div><div class="toolbar"><button class="primary" onclick="openPicker()">＋ Add exercise</button><button class="secondary" onclick="resetRoutine()">Reset day</button></div></section>${pickerOpen?renderPicker():''}<section class="card"><div class="warm-card"><div class="warm-icon">🔥</div><div><div style="font-weight:800">Warm-up</div><div class="muted">${esc(d.warm||'5–10 min easy cardio + light warm-up sets')}</div></div></div></section>${d.exercises.map((ex,ei)=>{let img=imageSrcForExercise(ex.name);let open=openExercise===ei;return `<section class="exercise-card ${open?'open':''}"><button class="exercise-head" onclick="toggleExercise(${ei})"><div class="ex-badge">${ei+1}</div><img class="exercise-mini" src="${img}" alt="${esc(ex.name)}"><div><div class="exercise-name">${esc(ex.name)}</div><div class="exercise-target">${ex.sets} × ${esc(ex.reps)}</div></div><div class="tiny muted">⋯</div><div class="chev">${open?'▾':'▸'}</div></button>${open?`<div class="exercise-body">${renderExerciseMedia(ex.name,true)}<div class="sethdr"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span></div>${Array.from({length:ex.sets},(_,i)=>{let o=getSet(ex,i+1),val=o.values;return `<div class="setrow"><div class="setnum">${i+1}</div><input class="setinput" inputmode="decimal" type="number" min="0" step="0.5" id="w-${ei}-${i}" value="${esc(val.weight)}" placeholder="kg"><input class="setinput" inputmode="numeric" type="number" min="0" step="1" id="r-${ei}-${i}" value="${esc(val.reps)}" placeholder="#"><button aria-label="Save set" class="checkbtn ${o.done?.done?'done':''}" onclick="event.stopPropagation();logSet(${ei},${i+1})">✓</button></div><div class="previous-set">${o.prev?`↩ Last time: <strong>${fmt(o.prev.weight)} kg × ${fmt(o.prev.reps)} reps</strong> · ${esc(niceDate(o.prev.date))}`:'↩ No previous set recorded yet'}</div>`}).join('')}<button class="addset" onclick="event.stopPropagation();addSet(${ei})">＋ Add set</button><div class="rest-inline"><div class="rest-chip">⏱ ${esc(ex.rest||'90 sec')}</div><div class="tiny muted">Target: ${esc(ex.reps)}</div></div><div class="exercise-actions"><button class="secondary" onclick="event.stopPropagation();configureExercise(${ei})">Edit sets & reps</button><button class="secondary danger" onclick="event.stopPropagation();removeExercise(${ei})">Remove</button></div></div>`:''}</section>`}).join('')}<div class="tiny-note">Finish workout by logging your sets. Personal records update automatically from saved sets.</div><div class="sticky-timer"><div class="timer-left"><div class="timer-label">Rest timer</div><div class="timer-line"><div id="clock" class="timer-value">${active?'0:00':restChoice+'s'}</div><select id="restSelect" class="timer-select" onchange="setRestDuration(+this.value)"><option value="60" ${restChoice===60?'selected':''}>60s</option><option value="90" ${restChoice===90?'selected':''}>90s</option><option value="120" ${restChoice===120?'selected':''}>120s</option><option value="180" ${restChoice===180?'selected':''}>180s</option></select></div></div><button class="timer-start ${active?'running':''}" id="restAction" onclick="startSelectedRest()">${active?'Stop rest':'Start rest'}</button></div>`}
function toggleExercise(i){openExercise=openExercise===i?-1:i;render()}
function addSet(i){let list=ensureCustom();list[i].sets=(parseInt(list[i].sets)||0)+1;save();render()}
function setRestDuration(sec){restChoice=sec;updateClock()}
function startSelectedRest(){if(timerEnd>Date.now())stopRest();else startRest(restChoice)}
function openPicker(){pickerOpen=!pickerOpen;render();if(pickerOpen)document.getElementById('pickerSearch')?.focus()}
const LIBRARY={
'Chest':['Barbell bench press','Dumbbell bench press','Incline barbell bench press','Incline dumbbell press','Decline bench press','Machine chest press','Pec deck','Cable chest fly','Dumbbell chest fly','Push-ups','Chest dips','Smith machine bench press'],
'Back':['Pull-ups','Assisted pull-ups','Chin-ups','Lat pulldown','Close-grip lat pulldown','Seated cable row','Chest-supported row','Bent-over barbell row','One-arm dumbbell row','T-bar row','Machine row','Straight-arm pulldown','Deadlift','Rack pull','Back extensions'],
'Shoulders':['Overhead barbell press','Seated dumbbell shoulder press','Machine shoulder press','Arnold press','Dumbbell lateral raise','Cable lateral raise','Front raise','Rear-delt fly','Reverse pec deck','Face pulls','Upright row','Barbell shrugs','Dumbbell shrugs'],
'Biceps':['Barbell curl','EZ-bar curl','Dumbbell curl','Hammer curl','Incline dumbbell curl','Preacher curl','Cable curl','Concentration curl','Reverse curl'],
'Triceps':['Rope triceps pushdown','Straight-bar pushdown','Overhead rope extension','Skull crushers','Close-grip bench press','Assisted dips','Triceps dips','Dumbbell overhead extension','Single-arm cable extension'],
'Legs & glutes':['Back squat','Front squat','Goblet squat','Hack squat','Leg press','Bulgarian split squat','Walking lunges','Reverse lunges','Leg extension','Seated leg curl','Lying leg curl','Romanian deadlift','Hip thrust','Glute bridge','Cable kickback','Hip abductor machine','Hip adductor machine','Standing calf raise','Seated calf raise','Smith machine squat','Step-ups'],
'Core':['Cable crunch','Crunches','Hanging leg raise','Hanging knee raise','Plank','Side plank','Ab wheel rollout','Russian twist','Bicycle crunch','Decline sit-up','Woodchoppers','Dead bug'],
'Cardio':['Treadmill','Incline walking','Exercise bike','Rowing machine','Stair climber','Elliptical','Jump rope','Outdoor running'],
'Forearms':['Wrist curl','Reverse wrist curl','Farmer’s carry','Dead hang','Wrist roller']};
const ALL_EXERCISES=[...new Set([...Object.values(LIBRARY).flat(),...PLAN.days.flatMap(d=>d.exercises.map(e=>e.name))])].sort((a,b)=>a.localeCompare(b));
function renderPicker(){let q=exerciseSearch.trim().toLowerCase();let entries=ALL_EXERCISES.filter(x=>(exerciseCategory==='All'||LIBRARY[exerciseCategory]?.includes(x))&&x.toLowerCase().includes(q));return `<section class="card" id="picker"><div class="row"><h3>Exercise library</h3><button class="secondary" onclick="openPicker()">Close ✕</button></div><input class="field" id="pickerSearch" aria-label="Search exercises" placeholder="Search exercises…" value="${esc(exerciseSearch)}" oninput="exerciseSearch=this.value;filterLibrary()"><div class="days" id="pickerCategories">${['All',...Object.keys(LIBRARY)].map(c=>`<button class="daybtn ${exerciseCategory===c?'selected':''}" onclick="exerciseCategory=${JSON.stringify(c).replace(/"/g,'&quot;')};render()">${esc(c)}</button>`).join('')}</div><div id="libraryResults">${renderLibraryResults(entries)}</div><p class="tiny muted">Tap any exercise to see its picture and quick form tips. Can't find one? Add a custom exercise below.</p><button class="secondary full" onclick="addCustomExercise()">＋ Create custom exercise</button></section>`}
function renderLibraryResults(entries){return entries.length?entries.map(n=>`<div class="library-row"><img class="exercise-thumb" src="${imageSrcForExercise(n)}" alt="${esc(n)} exercise guide"><div><div><b>${esc(n)}</b></div><div class="tiny muted">${esc(categoryForExercise(n))}</div></div><button class="secondary" onclick="addExerciseByName(decodeURIComponent('${encodeURIComponent(n)}'))">＋ Add</button></div>`).join(''):'<p class="empty">No matches. Try another search or create your own.</p>'}
function filterLibrary(){let q=exerciseSearch.trim().toLowerCase();document.getElementById('libraryResults').innerHTML=renderLibraryResults(ALL_EXERCISES.filter(x=>(exerciseCategory==='All'||LIBRARY[exerciseCategory]?.includes(x))&&x.toLowerCase().includes(q)))}
function ensureCustom(){state.customDays ||= {};const d=day();if(!state.customDays[d.day])state.customDays[d.day]=d.exercises.map(x=>({...x}));return state.customDays[d.day]}
function askSetsReps(sets=3,reps='8–12'){let s=prompt('How many sets? (1–12)',String(sets));if(s===null)return null;s=Number(s);if(!Number.isInteger(s)||s<1||s>12){alert('Choose between 1 and 12 sets.');return null}let r=prompt('Target reps (for example 8–12, 10, or 30 seconds)',String(reps));if(r===null)return null;r=r.trim().slice(0,35);if(!r){alert('Enter a rep target.');return null}return {sets:s,reps:r}}
function addExerciseByName(name){if(day().exercises.some(e=>e.name===name)){alert('This exercise is already in this day.');return}let config=askSetsReps();if(!config)return;ensureCustom().push({name,...config,rest:'90 sec'});save();pickerOpen=false;render()}
function addCustomExercise(){let name=prompt('Name your exercise:');if(!name)return;name=name.trim().slice(0,75);if(!name)return;addExerciseByName(name)}
function configureExercise(i){let d=day(),ex=d.exercises[i],config=askSetsReps(ex.sets,ex.reps);if(!config)return;let list=ensureCustom();list[i]={...list[i],...config};save();render()}
function removeExercise(i){if(!confirm('Remove this exercise from your routine? Previously logged sets will stay in your history.'))return;ensureCustom().splice(i,1);save();render()}
function resetRoutine(){if(!confirm('Restore the original exercises, sets and reps for this day? Saved workout history is not deleted.'))return;delete state.customDays[day().day];save();render()}
function validStrengthSet(l){return l&&l.done&&Number.isFinite(+l.weight)&&+l.weight>0&&Number.isInteger(+l.reps)&&+l.reps>=1&&+l.reps<=12&& !/seconds?|plank|treadmill|walking|running|bike|elliptical|stair climber|rowing machine|jump rope|dead hang|farmer.s carry/i.test(l.exercise)}
function personalRecords(name,source=state.logs){const rows=source.filter(l=>l.done&&l.exercise===name);const weightRows=rows.filter(l=>Number.isFinite(+l.weight)&&+l.weight>0);const repRows=rows.filter(l=>Number.isFinite(+l.reps)&&+l.reps>0);const strength=rows.filter(validStrengthSet);return {heavy:weightRows.reduce((b,l)=>!b||+l.weight>+b.weight?l:b,null),reps:repRows.reduce((b,l)=>!b||+l.reps>+b.reps?l:b,null),estimated:strength.reduce((b,l)=>!b||estimatedMax(l)>estimatedMax(b)?l:b,null)}}
function estimatedMax(l){return +l.weight*(1+(+l.reps)/30)}
function renderPRPanel(name){const p=personalRecords(name);return `<section class="card"><div class="row"><h3 style="margin:0">🏆 Personal records</h3><span class="pill">${esc(name)}</span></div><div class="grid" style="margin-top:12px"><div class="stat"><small>Heaviest weight</small><b>${p.heavy?fmt(p.heavy.weight)+' kg':'—'}</b><small>${p.heavy?esc(niceDate(p.heavy.date)):'No sets logged'}</small></div><div class="stat"><small>Most reps in a set</small><b>${p.reps?fmt(p.reps.reps):'—'}</b><small>${p.reps?fmt(p.reps.weight)+' kg · '+esc(niceDate(p.reps.date)):'No sets logged'}</small></div><div class="stat" style="grid-column:1/-1"><small>Estimated 1-rep max</small><b>${p.estimated?fmt(estimatedMax(p.estimated))+' kg':'—'}</b><small>${p.estimated?fmt(p.estimated.weight)+' kg × '+fmt(p.estimated.reps)+' reps · '+esc(niceDate(p.estimated.date)):'Log a weighted set of 1–12 reps'}</small></div></div><p class="muted tiny">Estimated 1RM uses the Epley formula for weighted sets of 1–12 reps. It is an estimate, not a tested maximum. Timed exercises and zero-weight sets are excluded from this estimate.</p></section>`}
function renderPRList(){const all=state.logs.filter(x=>x.done);const names=[...new Set(all.map(x=>x.exercise))].sort((a,b)=>a.localeCompare(b));return `<section class="card"><h3>🏅 All exercise records</h3>${names.length?names.map(n=>{const p=personalRecords(n);return `<div class="row meal"><div><b>${esc(n)}</b><div class="muted tiny">${p.heavy?'Best weight '+fmt(p.heavy.weight)+' kg':'No weighted PR'} · ${p.reps?'Most reps '+fmt(p.reps.reps):'No rep PR'}</div></div><button class="secondary" onclick="metric=decodeURIComponent('${encodeURIComponent(n)}');render();window.scrollTo(0,0)">View</button></div>`}).join(''):'<p class="muted">Log a workout set to start collecting personal records.</p>'}</section>`}
function bindWorkout(){updateClock();const sel=document.getElementById('restSelect');if(sel)sel.value=String(restChoice)}function logSet(ei,n){let d=day(),ex=d.exercises[ei],dt=window.workDate||today(),w=document.getElementById(`w-${ei}-${n-1}`).value,r=document.getElementById(`r-${ei}-${n-1}`).value;if(w===''||r===''||+w<0||+r<=0){alert('Enter weight (0 allowed) and reps first.');return}state.logs=state.logs.filter(x=>!(x.date===dt&&x.day===d.day&&x.exercise===ex.name&&x.set===n));const before=personalRecords(ex.name);const record={date:dt,day:d.day,exercise:ex.name,set:n,weight:+w,reps:+r,done:true};state.logs.push(record);const after=personalRecords(ex.name);const newPRs=[];if(+w>0&&after.heavy===record&&(!before.heavy||+w>+before.heavy.weight))newPRs.push('Heaviest lift: '+fmt(w)+' kg');if(after.reps===record&&(!before.reps||+r>+before.reps.reps))newPRs.push('Most reps: '+fmt(r));if(validStrengthSet(record)&&after.estimated===record&&(!before.estimated||estimatedMax(record)>estimatedMax(before.estimated)+0.01))newPRs.push('Estimated 1RM: '+fmt(estimatedMax(record))+' kg');save();render();startRest(parseInt(ex.rest)||restChoice||90);if(newPRs.length)alert('🏆 NEW PERSONAL RECORD!\n'+ex.name+'\n'+newPRs.join('\n'))}
function startRest(sec){timerEnd=Date.now()+sec*1000;timerNotified=false;clearInterval(timerInterval);updateClock();timerInterval=setInterval(updateClock,250)}function stopRest(){timerEnd=0;timerNotified=false;clearInterval(timerInterval);updateClock()}function updateClock(){const c=document.getElementById('clock'),btn=document.getElementById('restAction');if(!c)return;if(timerEnd>Date.now()){let n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));c.textContent=`${Math.floor(n/60)}:${String(n%60).padStart(2,'0')}`;if(btn){btn.textContent='Stop rest';btn.classList.add('running')}}else if(timerEnd){c.textContent='Done ✓';if(btn){btn.textContent='Start rest';btn.classList.remove('running')}clearInterval(timerInterval);if(!timerNotified){timerNotified=true;try{navigator.vibrate&&navigator.vibrate([180,120,180])}catch(e){}setTimeout(()=>{const c2=document.getElementById('clock');if(c2&&c2.textContent==='Done ✓')c2.textContent=restChoice+'s'},1400)}timerEnd=0}else{c.textContent=restChoice+'s';if(btn){btn.textContent='Start rest';btn.classList.remove('running')}}}
function options(){return [...new Set([...ALL_EXERCISES,...Object.values(state.customDays||{}).flatMap(list=>list.map(e=>e.name))])].map(x=>`<option ${metric===x?'selected':''}>${esc(x)}</option>`).join('')}
function renderProgress(){let all=state.logs.filter(l=>l.done).sort((a,b)=>b.date.localeCompare(a.date));let days=[...new Set(all.map(l=>l.date+'|'+l.day))];let best=all.filter(l=>l.exercise===metric).reduce((m,l)=>Math.max(m,l.weight),0);return `${renderPRPanel(metric)}<div class="card"><h2>Progress</h2><div class="grid"><div class="stat"><small>Workouts</small><b>${days.length}</b></div><div class="stat"><small>Best ${esc(metric)} (kg)</small><b>${fmt(best)}</b></div></div><p><label>Exercise to chart</label><select class="field" onchange="metric=this.value;render()">${options()}</select></p><canvas id="chart" width="640" height="250" role="img" aria-label="Exercise weight trend"></canvas><p class="muted tiny">Chart shows the highest logged weight on each workout date. Assisted dip / bodyweight values may not compare directly.</p></div>${renderPRList()}<div class="card"><h3>Workout history</h3>${days.length?days.map(key=>{let [date,dy]=key.split('|');let rows=all.filter(l=>l.date===date&&l.day===dy);return `<details><summary>${esc(niceDate(date))} · ${esc(dy)} <span class="muted tiny">(${rows.length} sets)</span></summary><div class="stack" style="margin-top:12px">${rows.map(l=>`<div class="row tiny"><div>${esc(l.exercise)} · set ${l.set}</div><div>${fmt(l.weight)} kg × ${fmt(l.reps)}</div></div>`).join('')}</div><button class="secondary danger" style="margin-top:12px" onclick="deleteSession('${esc(date)}','${esc(dy)}')">Delete session</button></details>`}).join(''):'<p class="empty">No workouts saved yet. Log your first set in Train.</p>'}</div><div class="card"><h3>Body weight</h3><div class="row"><input id="bw" class="field" type="number" step="0.1" min="0" placeholder="Weight in kg"><button class="primary" onclick="addBW()">Save</button></div>${state.bodyWeights.slice().reverse().slice(0,8).map(x=>`<div class="row meal"><span>${esc(niceDate(x.date))}</span><b>${fmt(x.kg)} kg</b></div>`).join('')}</div>`}
function drawGraph(){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d');let dat={};state.logs.filter(l=>l.done&&l.exercise===metric).forEach(l=>dat[l.date]=Math.max(dat[l.date]||0,l.weight));let pts=Object.entries(dat).sort(([a],[b])=>a.localeCompare(b));let w=c.width,h=c.height;ctx.clearRect(0,0,w,h);ctx.fillStyle='#a4abc1';ctx.font='19px sans-serif';if(!pts.length){ctx.fillText('Log some sets to see your progress.',40,125);return}let mn=Math.min(...pts.map(x=>x[1])),mx=Math.max(...pts.map(x=>x[1]));let hi=Math.max(1,mx),lo=Math.max(0,mn-(hi-mn)*.25);ctx.strokeStyle='#41404a';ctx.lineWidth=2;for(let i=0;i<4;i++){let y=25+i*60;ctx.beginPath();ctx.moveTo(50,y);ctx.lineTo(620,y);ctx.stroke()}ctx.strokeStyle='#ff2945';ctx.lineWidth=4;ctx.beginPath();pts.forEach(([date,value],i)=>{let x=60+(pts.length===1?0:i*535/(pts.length-1)),y=212-(value-lo)/(hi-lo||1)*175;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y)});ctx.stroke();pts.forEach(([date,value],i)=>{let x=60+(pts.length===1?0:i*535/(pts.length-1)),y=212-(value-lo)/(hi-lo||1)*175;ctx.fillStyle='#ff2945';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill()});ctx.fillStyle='#a4abc1';ctx.font='18px sans-serif';ctx.fillText(`${fmt(hi)} kg`,5,30);ctx.fillText(`${fmt(lo)} kg`,5,215);ctx.fillText(niceDate(pts[0][0]),55,247);if(pts.length>1)ctx.fillText(niceDate(pts.at(-1)[0]),490,247)}function deleteSession(date,dy){if(!confirm('Delete all logged sets for this workout?'))return;state.logs=state.logs.filter(l=>!(l.date===date&&l.day===dy));save();render()}function addBW(){let v=+document.getElementById('bw').value;if(!v||v<1||v>500){alert('Enter a valid body weight in kg.');return}state.bodyWeights=state.bodyWeights.filter(x=>x.date!==today());state.bodyWeights.push({date:today(),kg:v});state.bodyWeights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function renderFood(){let idx=new Date().getDay(),section=idx===0?'SUNDAY':idx===6?'SATURDAY':idx===5?'FRIDAY':'MONDAY–THURSDAY';return `<div class="card"><h2>Food plan</h2><div class="pill">${esc(section)}</div>${PLAN.foods[section].map(item=>`<div class="meal">${esc(item)}</div>`).join('')}<p class="muted tiny">Your uploaded plan, displayed as provided. Times around midnight are retained exactly as written.</p></div><div class="card"><h3>Supplements (from your plan)</h3>${PLAN.supplements.map(s=>`<div class="meal">${esc(s)}</div>`).join('')}<p class="muted tiny">This is a copy of your supplied plan, not a medical recommendation. Check supplement suitability, especially stimulant products.</p></div><div class="card"><h3>Monthly shopping checklist</h3>${PLAN.shopping.map((s,i)=>`<label class="checkrow ${state.shoppingChecked.includes(i)?'checked':''}"><input type="checkbox" ${state.shoppingChecked.includes(i)?'checked':''} onchange="toggleShop(${i})"><span>${esc(s)}</span></label>`).join('')}<button class="secondary" style="margin-top:12px" onclick="state.shoppingChecked=[];save();render()">Reset checklist</button></div>`}
function toggleShop(i){state.shoppingChecked=state.shoppingChecked.includes(i)?state.shoppingChecked.filter(x=>x!==i):[...state.shoppingChecked,i];save();render()}
function renderSettings(){return `<div class="card"><h2>Your data & backups</h2><p class="muted">Your logs stay in this browser on this device. They are not sent to a server.</p><div class="stack"><button class="primary" onclick="exportData()">⬇ Export backup (JSON)</button><label for="import">Import a previous backup</label><input class="field" type="file" id="import" accept=".json,application/json" onchange="importData(this)"><button class="secondary danger" onclick="clearData()">Clear my saved data</button></div></div><div class="card"><h3>Install on iPhone</h3><p>Once the app files are hosted on an HTTPS website, open the link in <b>Safari</b>, tap <b>Share</b>, then <b>Add to Home Screen</b>.</p><p class="muted tiny">Opening index.html directly from Files is not a dependable installation method; for reliable saving and offline use, host the app first (for example with free GitHub Pages).</p></div><div class="card"><h3>About this app</h3><p>Made specifically from your uploaded fitness ZIP. Includes a searchable exercise library, editable routines, and your original 41 exercises across five days, workout logging, rest timer, progress chart, automatic personal records, estimated 1RM, body weight, food plan and shopping list.</p><p class="muted tiny">Weights and exercise history are saved in browser storage. Export regularly: deleting Safari website data or changing devices can remove local data.</p></div>`}
function exportData(){const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='my-gym-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}async function importData(inp){let f=inp.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());let data=parsed.data||parsed;if(!Array.isArray(data.logs)||!Array.isArray(data.bodyWeights))throw Error('Unexpected backup format');if(!confirm('Replace your current logs with this backup?'))return;state={...state,...data};save();render();alert('Backup imported.')}catch(e){alert('Could not import backup: '+e.message)}}function clearData(){if(!confirm('Permanently delete all workouts and measurements on this device? Export a backup first.'))return;state={logs:[],bodyWeights:[],shoppingChecked:[],selectedDay:null,customDays:{}};save();render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
