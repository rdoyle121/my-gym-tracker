 const improvement=prior>0?Math.round((best-prior)/prior*100):null;
 const rangeOptions=[['1','Last month'],['3','Last 3 months'],['6','Last 6 months'],['12','Last year'],['0','All time']];
 const controls='<div class="progress-top"><button class="'+(progressView==='progress'?'active':'')+'" onclick="selectProgressView(\'progress\')">Progress</button><button class="'+(progressView==='history'?'active':'')+'" onclick="selectProgressView(\'history\')">History</button><button class="'+(progressView==='weight'?'active':'')+'" onclick="selectProgressView(\'weight\')">Body weight</button></div>';
 const range='<div class="progress-filter"><select aria-label="Chart date range" onchange="progressRange=this.value;render()">'+rangeOptions.map(([v,l])=>'<option value="'+v+'" '+(progressRange===v?'selected':'')+'>'+l+'</option>').join('')+'</select></div>';
 const strength='<section class="progress-panel"><div class="progress-panel-header"><h3><span class="pi">🏋️</span>Strength progress</h3><span style="color:#8d90a0">›</span></div><select class="field" aria-label="Exercise to chart" onchange="metric=this.value;render()">'+options()+'</select><div class="progress-cards"><div class="progress-mini"><small>🏆 Best weight (kg)</small><b>'+fmt(best)+'</b><em class="'+(improvement>0?'positive':'')+'">'+(improvement===null?'Personal best':(improvement>0?'↑ +':'')+improvement+'% vs first set')+'</em></div><div class="progress-mini"><small>🏋️ Total workouts</small><b>'+days.length+'</b><em>'+all.length+' sets logged</em></div></div><canvas id="chart" class="progress-chart" width="640" height="260" aria-label="Strength progress over time" role="img"></canvas></section>';
 const weight='<section class="progress-panel"><div class="progress-panel-header"><h3><span class="pi">⚖️</span>Body weight</h3><span style="color:#8d90a0">›</span></div><div class="progress-cards"><div class="progress-mini"><small>⚖️ Current weight</small><b>'+(current?fmt(current.kg)+' <span style="font-size:13px">kg</span>':'—')+'</b><em>'+(current?esc(niceDate(current.date)):'No weigh-in yet')+'</em></div><div class="progress-mini"><small>📈 Total change</small><b>'+(change===null?'—':(change>0?'+':'')+fmt(change)+' <span style="font-size:13px">kg</span>')+'</b><em class="'+(change!==null&&change<0?'positive':'')+'">'+(change===null?'Log two weigh-ins to compare':(change>0?'↑ Gain':change<0?'↓ Loss':'No change'))+'</em></div></div><canvas id="bw-chart" class="progress-chart" width="640" height="260" aria-label="Body weight trend" role="img"></canvas></section>';
 const weightInput='<div class="progress-weight-entry"><input id="bw" class="field" type="number" inputmode="decimal" step="0.1" min="0" placeholder="Current weight (kg)"><button class="primary" onclick="addBW()">Save</button></div>';
 const history='<div class="progress-panel"><div class="progress-panel-header"><h3>Workout history</h3></div>'+(days.length?days.map(key=>{let [date,dy]=key.split('|');let rows=all.filter(l=>l.date===date&&l.day===dy);return '<details><summary>'+esc(niceDate(date))+' · '+esc(dy)+' <span class="muted tiny">('+rows.length+' sets)</span></summary><div class="stack" style="margin-top:12px">'+rows.map(l=>'<div class="row tiny"><div>'+esc(l.exercise)+' · set '+l.set+'</div><div>'+fmt(l.weight)+' kg × '+fmt(l.reps)+'</div></div>').join('')+'</div><button class="secondary danger" style="margin-top:12px" onclick="deleteSession(\''+esc(date)+'\',\''+esc(dy)+'\')">Delete session</button></details>'}).join(''):'<p class="progress-empty">No workouts saved yet. Log your first set in Train.</p>')+'</div>';
 const weightHistory='<div class="progress-panel"><h3>Weight history</h3>'+weightInput+(bw.length?bw.slice().reverse().map(x=>'<div class="row meal"><span>'+esc(niceDate(x.date))+'</span><b>'+fmt(x.kg)+' kg</b></div>').join(''):'<p class="progress-empty">Save your first body-weight measurement above.</p>')+'</div>';
 return '<h2 style="margin:3px 0 15px">Your progress</h2>'+controls+(progressView==='history'?renderPRPanel(metric)+history+renderPRList():progressView==='weight'?range+weight+weightHistory:range+strength+weight+'<div style="margin:6px 0 20px"><button class="secondary full" onclick="selectProgressView(\'weight\')">＋ Log current weight →</button></div>');
}
function drawProgressCharts(){
 const limit=progressDates();
 drawTrend('chart',state.logs.filter(l=>l.done&&l.exercise===metric&&(!limit||l.date>=limit)).reduce((acc,l)=>{acc[l.date]=Math.max(acc[l.date]||0,Number(l.weight)||0);return acc},{}),'kg');
 drawTrend('bw-chart',state.bodyWeights.filter(l=>!limit||l.date>=limit).reduce((acc,l)=>{acc[l.date]=Number(l.kg)||0;return acc},{}),'kg');
}
function drawTrend(id,dat,unit){
 const canvas=document.getElementById(id);if(!canvas)return;
 const ctx=canvas.getContext('2d'),w=640,h=260,entries=Object.entries(dat).sort((a,b)=>a[0].localeCompare(b[0]));
 ctx.clearRect(0,0,w,h);ctx.textBaseline='middle';ctx.font='18px system-ui,sans-serif';
 if(!entries.length){ctx.fillStyle='#9799a8';ctx.textAlign='center';ctx.fillText('Log some measurements to see your trend.',w/2,128);ctx.textAlign='left';return}
 const vals=entries.map(x=>x[1]),min=Math.min(...vals),max=Math.max(...vals),pad=Math.max(1,(max-min)*.25),lo=Math.max(0,min-pad),hi=max+pad;
 const L=53,R=615,T=28,B=208,Y=v=>B-(v-lo)/(hi-lo||1)*(B-T),X=i=>L+(entries.length===1?.5:i/(entries.length-1))*(R-L);
 ctx.strokeStyle='#34313d';ctx.lineWidth=1;ctx.fillStyle='#858898';ctx.textAlign='right';
 for(let i=0;i<4;i++){let yy=T+(B-T)*i/3;ctx.beginPath();ctx.moveTo(L,yy);ctx.lineTo(R,yy);ctx.stroke();ctx.fillText(fmt(hi-(hi-lo)*i/3),45,yy)}
 if(entries.length>1){let fill=ctx.createLinearGradient(0,T,0,B);fill.addColorStop(0,'rgba(255,42,76,.31)');fill.addColorStop(1,'rgba(255,42,76,0)');ctx.beginPath();entries.forEach(([d,v],i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.lineTo(X(entries.length-1),B);ctx.lineTo(X(0),B);ctx.closePath();ctx.fillStyle=fill;ctx.fill()}
 ctx.beginPath();entries.forEach(([d,v],i)=>i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(i),Y(v)));ctx.strokeStyle='#ff3454';ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();
 entries.forEach(([d,v],i)=>{if(entries.length>35&&i!==entries.length-1)return;ctx.beginPath();ctx.arc(X(i),Y(v),4.5,0,Math.PI*2);ctx.fillStyle='#ff526e';ctx.fill();ctx.strokeStyle='#ffe1e6';ctx.lineWidth=1.4;ctx.stroke()});
 ctx.fillStyle='#a6a8b3';ctx.font='17px system-ui,sans-serif';ctx.textAlign='left';ctx.fillText(niceDate(entries[0][0]),L,244);ctx.textAlign='right';ctx.fillText(niceDate(entries.at(-1)[0]),R,244);
 const last=entries.at(-1);ctx.textAlign='right';ctx.fillStyle='#fff';ctx.font='bold 17px system-ui,sans-serif';ctx.fillText(fmt(last[1])+' '+unit,R,12);
}
function deleteSession(date,dy){if(!confirm('Delete all logged sets for this workout?'))return;state.logs=state.logs.filter(l=>!(l.date===date&&l.day===dy));save();render()}function addBW(){let v=+document.getElementById('bw').value;if(!v||v<1||v>500){alert('Enter a valid body weight in kg.');return}state.bodyWeights=state.bodyWeights.filter(x=>x.date!==today());state.bodyWeights.push({date:today(),kg:v});state.bodyWeights.sort((a,b)=>a.date.localeCompare(b.date));save();render()}
function renderFood(){let idx=new Date().getDay(),section=idx===0?'SUNDAY':idx===6?'SATURDAY':idx===5?'FRIDAY':'MONDAY–THURSDAY';return `<div class="card"><h2>Food plan</h2><div class="pill">${esc(section)}</div>${PLAN.foods[section].map(item=>`<div class="meal">${esc(item)}</div>`).join('')}<p class="muted tiny">Your uploaded plan, displayed as provided. Times around midnight are retained exactly as written.</p></div><div class="card"><h3>Supplements (from your plan)</h3>${PLAN.supplements.map(s=>`<div class="meal">${esc(s)}</div>`).join('')}<p class="muted tiny">This is a copy of your supplied plan, not a medical recommendation. Check supplement suitability, especially stimulant products.</p></div><div class="card"><h3>Monthly shopping checklist</h3>${PLAN.shopping.map((s,i)=>`<label class="checkrow ${state.shoppingChecked.includes(i)?'checked':''}"><input type="checkbox" ${state.shoppingChecked.includes(i)?'checked':''} onchange="toggleShop(${i})"><span>${esc(s)}</span></label>`).join('')}<button class="secondary" style="margin-top:12px" onclick="state.shoppingChecked=[];save();render()">Reset checklist</button></div>`}
function toggleShop(i){state.shoppingChecked=state.shoppingChecked.includes(i)?state.shoppingChecked.filter(x=>x!==i):[...state.shoppingChecked,i];save();render()}
function renderSettings(){return `<div class="card"><h2>Your data & backups</h2><p class="muted">Your logs stay in this browser on this device. They are not sent to a server.</p><div class="stack"><button class="primary" onclick="exportData()">⬇ Export backup (JSON)</button><label for="import">Import a previous backup</label><input class="field" type="file" id="import" accept=".json,application/json" onchange="importData(this)"><button class="secondary danger" onclick="clearData()">Clear my saved data</button></div></div><div class="card"><h3>Install on iPhone</h3><p>Once the app files are hosted on an HTTPS website, open the link in <b>Safari</b>, tap <b>Share</b>, then <b>Add to Home Screen</b>.</p><p class="muted tiny">Opening index.html directly from Files is not a dependable installation method; for reliable saving and offline use, host the app first (for example with free GitHub Pages).</p></div>`}
function exportData(){const b=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),data:state},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='my-gym-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)}async function importData(inp){let f=inp.files[0];if(!f)return;try{let parsed=JSON.parse(await f.text());let data=parsed.data||parsed;if(!Array.isArray(data.logs)||!Array.isArray(data.bodyWeights))throw Error('Unexpected backup format');if(!confirm('Replace your current logs with this backup?'))return;state={...state,...data};save();render();alert('Backup imported.')}catch(e){alert('Could not import backup: '+e.message)}}function clearData(){if(!confirm('Permanently delete all workouts and measurements on this device? Export a backup first.'))return;state={logs:[],bodyWeights:[],shoppingChecked:[],selectedDay:null,customDays:{}};save();render()}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
