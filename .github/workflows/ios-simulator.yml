name: iOS simulator build (test only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'release/native/**'
      - 'cloud-gym.html'
      - 'plan-data.js'
      - 'assets/**'
      - 'cloud-manifest.webmanifest'
      - 'cloud-privacy.html'
      - 'icon.svg'
      - 'mg-rendered-icon.png'
      - '.github/workflows/ios-simulator.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    name: Build iOS simulator app
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: release/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install native dependencies
        run: npm install --no-audit --no-fund
      - name: Stage web assets and add iOS project
        run: npm run native:add:ios
      - name: Apply MG iOS app icon
        run: npm run native:brand:ios
      - name: Configure iOS privacy permission descriptions
        run: node apply-ios-privacy.mjs
      - name: Install Capacitor iOS CocoaPods
        run: |
          cd ios/App
          pod install --repo-update
      - name: Build unsigned iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/mygym-ios-build" CODE_SIGNING_ALLOWED=NO ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO build 2>&1 | tee "$RUNNER_TEMP/mygym-xcodebuild.log" || {
            echo "==== Xcode errors (first 80 matches) ===="
            grep -nE 'error:|fatal error:|BUILD FAILED|SwiftEmitModule|GeneratedAssetSymbols.swift' "$RUNNER_TEMP/mygym-xcodebuild.log" | head -80 || true
            exit 1
          }
      - name: Package simulator .app
        run: |
          cd "$RUNNER_TEMP/mygym-ios-build/Build/Products/Debug-iphonesimulator"
          ditto -c -k --sequesterRsrc --keepParent App.app "$RUNNER_TEMP/my-gym-tracker-ios-simulator.zip"
      - name: Audit iOS native configuration
        run: node audit-native.mjs ios
      - uses: actions/upload-artifact@v4
        with:
          name: my-gym-tracker-ios-security-audit
          path: release/native/audit/ios-audit.md
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: my-gym-tracker-ios-simulator
          path: ${{ runner.temp }}/my-gym-tracker-ios-simulator.zip
          if-no-files-found: error
          retention-days: 7
