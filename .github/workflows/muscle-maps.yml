name: Generate muscle-only maps
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/muscle-maps.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crop anatomy from existing workout photos
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance
          from pathlib import Path
          out=Path('muscle-maps')
          out.mkdir(exist_ok=True)
          for name in ['chest','back','shoulders','biceps','triceps','legs_glutes','core','cardio','forearms']:
              path=Path('assets')/(name+'.png')
              if not path.exists(): continue
              im=Image.open(path).convert('RGB')
              w,h=im.size
              # Right half contains the muscle-highlighted anatomy figure;
              # bottom labels and the left gym photograph are excluded.
              crop=im.crop((round(w*.51),round(h*.04),round(w*.985),round(h*.79)))
              cw,ch=crop.size
              side=min(cw,ch)
              crop=crop.crop(((cw-side)//2,(ch-side)//2,(cw+side)//2,(ch+side)//2))
              crop=ImageEnhance.Contrast(crop).enhance(1.11)
              crop.resize((360,360),Image.Resampling.LANCZOS).save(out/(name+'.png'),optimize=True)
          PY
      - name: Commit generated muscle maps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add muscle-maps/
          if ! git diff --cached --quiet; then
            git commit -m "Add anatomy-only muscle map images"
            git push
          fi
