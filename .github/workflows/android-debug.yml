name: Android debug APK (test only)

on:
  workflow_dispatch:
  push:
    paths:
      - 'release/native/**'
      - 'cloud-gym.html'
      - 'plan-data.js'
      - 'assets/**'
      - 'cloud-manifest.webmanifest'
      - 'cloud-privacy.html'
      - 'icon.svg'
      - 'mg-rendered-icon.png'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: release/native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # GitHub-hosted Ubuntu runners already include Android SDK command-line tools.
      # Avoid setup-android@v3's failing sdkmanager package refresh.
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platform-tools"
          echo "Using preinstalled Android SDK"
      - name: Install native project dependencies
        run: npm install --no-audit --no-fund
      - name: Stage cloud assets and generate Android project
        run: npm run native:add:android
      - name: Build unsigned-for-release Android debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: release/native/android
      - uses: actions/upload-artifact@v4
        with:
          name: my-gym-tracker-android-debug-apk
          path: release/native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
