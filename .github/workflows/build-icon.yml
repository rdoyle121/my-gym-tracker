name: Build iPhone icon
on:
  push:
    branches: [main]
    paths: ['icon.svg', '.github/workflows/build-icon.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert icon for iPhone
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='icon.svg',write_to='apple-touch-icon-mg.png',output_width=512,output_height=512)
          PY
      - name: Save PNG to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon-mg.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate iPhone PNG app icon"
            git push
          fi
