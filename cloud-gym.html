function getSet(ex,i){let key=day().day+'|'+ex.name+'|'+i;let done=logsFor(window.workDate||today(),day().day).find(l=>l.exercise===ex.name&&l.set===i);let prev=state.logs.filter(l=>l.exercise===ex.name&&l.set===i&&l.date!==(window.workDate||today())&&l.done).sort((a,b)=>b.date.localeCompare(a.date))[0];return {key,done,prev,values:edit[key]||done||prev||{weight:'',reps:''}}}
function overloadAdvice(ex){
 const chosen=window.workDate||today(),rows=state.logs.filter(l=>l.done&&l.exercise===ex.name&&l.date<chosen&&Number(l.weight)>0&&Number(l.reps)>0);
 if(!rows.length)return '<div class="overload-advice"><b>📈 Progressive overload</b><div>Log your first weighted workout to unlock a suggestion.</div></div>';

 const weights=last.map(l=>Number(l.weight)),base=Math.max(...weights),allHit=top!==null&&last.length>=(Number(ex.sets)||1)&&last.every(l=>Number(l.reps)>=top),isLower=/squat|deadlift|leg press|hack squat|lunge|hip thrust|glute|calf|leg extension|leg curl/i.test(ex.name),step=isLower?5:2.5;

 if(cardio)return '';

function renderWorkout(){const d=day();const heroImg=d.exercises.length?imageSrcForExercise(d.exercises[0].name):'https://images.unsplash.com/photo-1603665409265-bdc00027c217?auto=format&fit=crop&w=480&h=480&q=80';const active=timerEnd>Date.now();return `<section class="card workout-hero"><div class="hero-inner"><img src="${heroImg}" alt="${esc(d.title)}"><div><div class="tiny muted">Today's workout</div><h2>${esc(d.title)}</h2><div class="workout-meta"><span>🏋️ ${d.exercises.length} exercises</span><span>⏱ ${esc(d.time||'~60 min')}</span></div></div></div></section><section class="card"><label>Workout date</label><input id="workdate" type="date" class="field" value="${esc(window.workDate||today())}" onchange="window.workDate=this.value;render()"><div class="days">${trainingDays().map(x=>`<button class="daybtn ${d.day===x.day?'selected':''}" onclick="pickDay('${x.day}')">${x.day.slice(0,3)}</button>`).join('')}</div><div class="toolbar"><button class="secondary" onclick="editDayDetails()">✎ Name / time</button><button class="secondary" onclick="setDayRest()">Rest day</button><button class="primary" onclick="openPicker()">＋ Add exercise</button></div></section>${pickerOpen?renderPicker():''}<section class="card"><div class="warm-card"><div class="warm-icon">🔥</div><div><div style="font-weight:800">Warm-up</div><div class="muted">${esc(d.warm||'5–10 min easy cardio + light warm-up sets')}</div></div></div></section>${renderWorkoutNotes()}${d.exercises.map((ex,ei)=>{let img=imageSrcForExercise(ex.name);let open=openExercise===ei;return `<section class="exercise-card ${open?'open':''}"><button class="exercise-head" onclick="toggleExercise(${ei})"><div class="ex-badge">${ei+1}</div><img class="exercise-mini" src="${img}" alt="${esc(categoryForExercise(ex.name))} muscle map" loading="lazy"><div><div class="exercise-name">${esc(ex.name)}</div><div class="exercise-target">${ex.sets} × ${esc(ex.reps)}</div></div><div class="tiny muted">⋯</div><div class="chev">${open?'▾':'▸'}</div></button>${open?`<div class="exercise-body">${renderExerciseMedia(ex.name,true)}${overloadAdvice(ex)}<div class="sethdr"><span>Set</span><span>Weight (kg)</span><span>Reps</span><span>Done</span></div>${Array.from({length:ex.sets},(_,i)=>{let o=getSet(ex,i+1),val=o.values;return `<div class="setrow"><div class="setnum">${i+1}</div><input class="setinput" inputmode="decimal" type="number" min="0" step="0.5" id="w-${ei}-${i}" value="${esc(val.weight)}" placeholder="kg"><input class="setinput" inputmode="numeric" type="number" min="0" step="1" id="r-${ei}-${i}" value="${esc(val.reps)}" placeholder="#"><button aria-label="Save set" class="checkbtn ${o.done?.done?'done':''}" onclick="event.stopPropagation();logSet(${ei},${i+1})">✓</button></div><div class="previous-set">${o.prev?`↩ Last time: <strong>${fmt(o.prev.weight)} kg × ${fmt(o.prev.reps)} reps</strong> · ${esc(niceDate(o.prev.date))}${o.done&&(+o.done.weight>+o.prev.weight||+o.done.reps>+o.prev.reps)?` <span class="improvement">↑ Improved ${[+o.done.weight>+o.prev.weight?'weight':'',+o.done.reps>+o.prev.reps?'reps':''].filter(Boolean).join(' & ')}!</span>`:''}`:'↩ No previous set recorded yet'}</div>`}).join('')}<button class="addset" onclick="event.stopPropagation();addSet(${ei})">＋ Add set</button><div class="rest-inline"><div class="rest-chip">⏱ ${esc(ex.rest||'90 sec')}</div><div class="tiny muted">Target: ${esc(ex.reps)}</div></div><div class="exercise-actions"><button class="secondary" onclick="event.stopPropagation();configureExercise(${ei})">Edit sets & reps</button><button class="secondary danger" onclick="event.stopPropagation();removeExercise(${ei})">Remove</button></div></div>`:''}</section>`}).join('')}<div class="tiny-note">Finish workout by logging your sets. Personal records update automatically from saved sets.</div><div class="sticky-timer"><div class="timer-left"><div class="timer-label">Rest timer</div><div class="timer-line"><div id="clock" class="timer-value">${active?'0:00':restChoic function openPicker(){pickerOpen=!pickerOpen;render();if(pickerOpen)document.getElementById('pickerSearch')?.focus()}
const LIBRARY={

function ensureCustom(){state.customDays ||= {};const d=day();if(!state.customDays[d.day])state.customDays[d.day]=d.exercises.map(x=>({...x}));return state.customDays[d.day]}
function askSetsReps(sets=3,reps='8–12'){let s=prompt('How many sets? (1–12)',String(sets));if(s===null)return null;s=Number(s);if(!Number.isInteger(s)||s<1||s>12){alert('Choose between 1 and 12 sets.');return null}let r=prompt('Target reps (for example 8–12, 10, or 30 seconds)',String(reps));if(r===null)return null;r=r.trim().slice(0,35);if(!r){alert('Enter a rep target.');return null}return {sets:s,reps:r}}

function validStrengthSet(l){return l&&l.done&&Number.isFinite(+l.weight)&&+l.weight>0&&Number.isInteger(+l.reps)&&+l.reps>=1&&+l.reps<=12&& !/seconds?|plank|treadmill|walking|running|bike|elliptical|stair climber|rowing machine|jump rope|dead hang|farmer.s carry/i.test(l.exercise)}
function personalRecords(name,source=state.logs){const rows=source.filter(l=>l.done&&l.exercise===name);const weightRows=rows.filter(l=>Number.isFinite(+l.weight)&&+l.weight>0);const repRows=rows.filter(l=>Number.isFinite(+l.reps)&&+l.reps>0);const strength=rows.filter(validStrengthSet);return {heavy:weightRows.reduce((b,l)=>!b||+l.weight>+b.weight?l:b,null),reps:repRows.reduce((b,l)=>!b||+l.reps>+b.reps?l:b,null),estimated:strength.reduce((b,l)=>!b||estimatedMax(l)>estimatedMax(b)?l:b,null)}}
function estimatedMax(l){return +l.weight*(1+(+l.reps)/30)}

const PR_CORE=['Barbell Bench Press','Barbell Back Squat','Conventional Deadlift','Overhead Press','Barbell Row'];
function prNames(){return [...new Set([...PR_CORE,...state.logs.filter(x=>x.done).map(x=>x.exercise),...(state.manualPRs||[]).map(x=>x.exercise)])]}
function prLogRows(name){return [...state.logs.filter(x=>x.done&&x.exercise===name),...(state.manualPRs||[]).filter(x=>x.exercise===name)].filter(x=>Number(x.weight)>0&&Number(x.reps)>0)}
function renderPRTab(){const names=prNames(),manual=(state.manualPRs||[]);return '<h2 style="margin:4px 0 15px">🏆 Personal Records</h2><p class="muted tiny">Your best lifts update automatically from logged workouts. You can also add a lift manually below.</p>'+names.map((n,i)=>{const rows=prLogRows(n),heavy=rows.reduce((best,x)=>!best||Number(x.weight)>Number(best.weight)?x:best,null),oneRep=rows.filter(x=>Number(x.reps)>=1&&Number(x.reps)<=12).reduce((best,x)=>!best||estimatedMax(x)>estimatedMax(best)?x:best,null);return '<section class="pr-result"><h3>'+esc(n)+'</h3><div class="row"><div><small>Best weight</small><div class="pr-best">'+(heavy?fmt(heavy.weight)+' kg':'—')+'</div><small>'+(heavy?fmt(heavy.reps)+' reps · '+esc(niceDate(heavy.date)):'No records yet')+'</small></div><div style="text-align:right"><small>Estimated 1RM</small><div class="pr-best">'+(oneRep?fmt(estimatedMax(oneRep))+' kg':'—')+'</div><small>'+ (oneRep?'Calculated from '+fmt(oneRep.reps)+' reps':'1–12 rep sets only')+'</small></div></div></section>'}).join('')+'<section class="extra-card"><h3>＋ Add a PR manually</h3><div class="pr-entry"><select id="pr-exercise" class="field full">'+names.map((n,i)=>'<option value="'+i+'">'+esc(n)+'</option>').join('')+'</select><input id="pr-custom" class="field full" placeholder="Or enter another lift (optional)" maxlength="100"><input id="pr-weight" class="field" type="number" min="0.1" step="0.5" inputmode="decimal" placeholder="Weight (kg)"><input id="pr-reps" class="field" type="number" min="1" step="1" inputmode="numeric" placeholder="Reps"><input id="pr-date" class="field full" type="date" value="'+today()+'"><button class="primary full" onclick="addManualPR()">Save lift</button></div></section><section class="extra-card"><h3>Manually added lifts</h3>'+(manual.length?manual.slice().reverse().map(x=>'<div class="row meal"><div><b>'+esc(x.exercise)+'</b><div class="muted tiny">'+fmt(x.weight)+' kg × '+fmt(x.reps)+' · '+esc(niceDate(x.date))+'</div></div><button class="secondary danger" onclick="removeManualPR(\''+encodeURIComponent(x.id).replace(/'/g,'%27')+'\')">Delete</button></div>').join(''):'<p class="muted tiny">No manually saved lifts yet.</p>')+'</section>'}
function addManualPR(){const names=prNames(),name=document.getElementById('pr-custom').value.trim()||names[Number(document.getElementById('pr-exercise').value)],w=Number(document.getElementById('pr-weight').value),r=Number(document.getElementById('pr-reps').value),date=document.getElementById('pr-date').value;if(!name||!Number.isFinite(w)||w<=0||w>1000||!Number.isInteger(r)||r<1||r>1000||!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>today()){alert('Enter a valid lift, weight, reps and date (not in the future).');return}if(!Array.isArray(state.manualPRs))state.manualPRs=[];state.manualPRs.push({id:String(Date.now())+Math.random().toString(36).slice(2),exercise:name,weight:w,reps:r,date,done:true});save();render()}

function bindWorkout(){updateClock();const sel=document.getElementById('restSelect');if(sel)sel.value=String(restChoice)}function logSet(ei,n){let d=day(),ex=d.exercises[ei],dt=window.workDate||today(),w=document.getElementById(`w-${ei}-${n-1}`).value,r=document.getElementById(`r-${ei}-${n-1}`).value;if(w===''||r===''||+w<0||+r<=0){alert('Enter weight (0 allowed) and reps first.');return}state.logs=state.logs.filter(x=>!(x.date===dt&&x.day===d.day&&x.exercise===ex.name&&x.set===n));const before=personalRecords(ex.name);const record={date:dt,day:d.day,exercise:ex.name,set:n,weight:+w,reps:+r,done:true};state.logs.push(record);const after=personalRecords(ex.name);const newPRs=[];if(+w>0&&after.heavy===record&&(!before.heavy||+w>+before.heavy.weight))newPRs.push('Heaviest lift: '+fmt(w)+' kg');if(after.reps===record&&(!before.reps||+r>+before.reps.reps))newPRs.push('Most reps: '+fmt(r));if(validStrengthSet(record)&&after.estimated===record&&(!before.estimated||estimatedMax(record)>estimatedMax(before.estimated)+0.01))newPRs.push('Estimated 1RM: '+fmt(estimatedMax(record))+' kg');save();render();startRest(restChoice);if(newPRs.length)alert('🏆 NEW PERSONAL RECORD!\n'+ex.name+'\n'+newPRs.join('\n'))}

const MEASURE_FIELDS=[['waist','Waist'],['chest','Chest'],['arms','Arms'],['thighs','Thighs'],['hips','Hips']];
function measurementSchedule(){
 const rows=(state.bodyMeasurements||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)),last=rows.at(-1),weeks=[2,3,4].includes(Number(state.weighInWeeks))?Number(state.weighInWeeks):2;
 const next=last?new Date(last.date+'T12:00:00'):null;if(next)next.setDate(next.getDate()+7*weeks);

}
function renderBodyMeasurements(){
 const {rows,last,weeks,next,due}=measurementSchedule(),first=rows[0];
 const cards=MEASURE_FIELDS.map(([key,label])=>{

 return '<div class="progress-mini"><small>'+label+'</small><b>'+(a?fmt(a)+' <span style="font-size:12px">cm</span>':'—')+'</b><em>'+(diff===null?'No comparison yet':(diff>0?'+':'')+fmt(diff)+' cm since first entry')+'</em></div>'

const PHOTO_DB='my-gym-private-photos',PHOTO_STORE='photos';let photoUrls=[];

 const combinedOther={...remote,...local};for(const key of Object.keys(cloudOther)){if(!(key in localOther))combinedOther[key]=copy(cloudOther[key])}
 const merged=mergeWorkoutRecords(local,remote);merged.state={...combinedOther,logs:merged.state.logs};
 if(merged.conflicts.length){const details=merged.conflicts.map(c=>'<div style="border:1px solid #82465b;padding:12px;border-radius:12px;margin-top:10px"><b>'+esc(c.slot)+'</b><p class="muted tiny">LOCAL: '+c.local.map(x=>esc(x.weight)+' kg × '+esc(x.reps)+' reps, completed: '+esc(x.done)).join('; ')+'</p><p class="muted tiny">CLOUD: '+esc(c.cloud.weight)+' kg × '+esc(c.cloud.reps)+' reps, completed: '+esc(c.cloud.done)+'</p></div>').join('');window.cloudConflictDetails=details;const el=document.getElementById('cloud-conflict-detail');if(el)el.innerHTML=details;status('⚠️ '+merged.conflicts.length+' workout slot(s) differ. Both versions shown below; neither changed.');return}
 const summary='Local: '+local.logs.length+' sets; cloud: '+remote.logs.length+' sets.\nUnique cloud sets to add: '+merged.added+'. Exact duplicates skipped: '+merged.duplicates+'.\nResult: '+merged.state.logs.length+' sets.';
 status(summary.replaceAll('\n',' | '));
 if(!confirm(summary+'\n\nDownload a safety backup of both copies before continuing?'))return;
 downloadConflictBackup(local,remote);
 if(!confirm('Check that the backup JSON downloaded successfully. Merge both workout lists and upload the result to Supabase?'))return;
 if(!window.cloudGymUser||window.cloudGymUser.id!==account||!same(state,local)){status('Local data changed during review. Please start again.');return}
 const fresh=await cloudRow();
 if(fresh?.id!==row.id||fresh?.updated_at!==row.updated_at){conflict();return}
 const payload={kind:'gym-cloud-snapshot-v1',version:1,savedAt:new Date().toISOString(),state:copy(merged.state)};
 const {data,error}=await sb.from('user_settings').update({data:payload,updated_at:new Date().toISOString()}).eq('id',row.id).eq('user_id',account).eq('updated_at',row.updated_at).select('id,updated_at').maybeSingle();
 if(error)throw error;if(!data){conflict();return}
 state=merged.state;localStorage.setItem(K,JSON.stringify(state));cloudRowId=data.id;baseUpdatedAt=data.updated_at;lastCloudState=copy(state);blocked=false;render();
 status('✓ Merged successfully: '+state.logs.length+' sets. Cloud and local data match. Automatic syncing resumed.');
 }catch(e){status('Merge stopped safely: '+e.message+'. Existing local data was not changed.')}};

window.cloudKeepOne=async()=>{if(!window.cloudGymUser)return;
 const account=window.cloudGymUser.id,local=copy(state);
 if(!Array.isArray(local.logs)){status('Invalid local workout records. No changes made.');return}
 try{
 status('Checking online copy before cleanup…');
 const row=await cloudRow();
 if(!row?.data?.state||!Array.isArray(row.data.state.logs)){status('Cloud snapshot missing or invalid. No changes made.');return}
 const remote=copy(row.data.state);
 const target={date:'2026-10-10',day:'MONDAY',exercise:'Machine chest press',set:1,weight:20,reps:10,done:true};
 const match=x=>x.date===target.date&&x.day===target.day&&x.exercise===target.exercise&&Number(x.set)===1&&Number(x.weight)===20&&Number(x.reps)===10&&x.done===true;
 if(!local.logs.some(match)){status('Confirmed 20 kg set not found locally. Cleanup stopped.');return}
 const keep=copy(local.logs.find(match));
 if(!confirm('TEST WORKOUT CLEANUP: Keep ONLY Machine chest press Set 1 (20 kg × 10) on 2026-10-10. Remove the other '+(local.logs.length-1)+' local set(s) and '+remote.logs.length+' cloud set(s) from this account snapshot? This does not touch your original app.'))return;
 downloadConflictBackup(local,remote);
 if(!confirm('Make sure the safety JSON backup downloaded successfully. Confirm that you want exactly ONE test set in both this device and your cloud snapshot.'))return;
 if(!window.cloudGymUser||window.cloudGymUser.id!==account||!same(state,local)){status('Local data changed during cleanup. No changes made.');return}
 const fresh=await cloudRow();
 if(fresh?.id!==row.id||fresh?.updated_at!==row.updated_at){conflict();return}
 const next={...local,logs:[keep]};
 const payload={kind:'gym-cloud-snapshot-v1',version:1,savedAt:new Date().toISOString(),state:copy(next)};
 const {data,error}=await sb.from('user_settings').update({data:payload,updated_at:new Date().toISOString()}).eq('id',row.id).eq('user_id',account).eq('updated_at',row.updated_at).select('id,updated_at').maybeSingle();
 if(error)throw error;
 if(!data){conflict();return}
 state=next;localStorage.setItem(K,JSON.stringify(state));
 cloudRowId=data.id;baseUpdatedAt=data.updated_at;lastCloudState=copy(state);blocked=false;window.cloudConflictDetails='';
 render();status('✓ Test cleanup complete. 1 local set and 1 cloud snapshot set: Machine chest press 20 kg × 10. Other tracking categories were preserved.');
 }catch(e){status('Cleanup failed: '+e.message+'. Local records were not replaced.')}};
window.cloudFirstBackup=async()=>{if(!window.cloudGymUser)return;if(syncing||initializing){status('Another cloud operation is running. Wait and try again.');return}
 syncing=true;clearTimeout(queue);const account=window.cloudGymUser.id;const local=copy(state);
 try{status('Checking for an existing cloud backup before upload…');
 const row=await cloudRow();
 if(!window.cloudGymUser||window.cloudGymUser.id!==account||!same(local,state)){status('Account or local data changed. Nothing uploaded.');return}
 if(row){const remote=row.data?.state;const categories=[...new Set([...Object.keys(local),...Object.keys(remote||{})])].filter(k=>!same(local[k]??null,remote?.[k]??null));status('🛡️ Cloud backup already exists. No overwrite performed. Differences: '+(categories.join(', ')||'none')+'. Use Compare copies & download safety backup.');return}
 const configured=Object.values(local.customDays||{}).reduce((n,v)=>n+(Array.isArray(v)?v.length:0),0);
 if(!confirm('No cloud backup was found for this account. Create your first cloud snapshot with '+configured+' planned exercise(s), '+(local.logs?.length||0)+' logged set(s), and the other local app settings? Nothing will be deleted.')){status('First backup cancelled; local workout unchanged.');return}
 const again=await cloudRow();if(again){status('A cloud backup appeared while preparing the upload. Nothing overwritten; compare copies.');return}
 if(!window.cloudGymUser||window.cloudGymUser.id!==account||!same(local,state)){status('Local data changed. Start again to avoid losing edits.');return}
 const payload={kind:'gym-cloud-snapshot-v1',version:1,savedAt:new Date().toISOString(),state:local};
 const {data,error}=await sb.from('user_settings').insert({user_id:account,data:payload}).select('id,updated_at').single();
 if(error)throw error;if(!data)throw Error('Supabase did not confirm insertion.');
 cloudRowId=data.id;baseUpdatedAt=data.updated_at;lastCloudState=copy(local);blocked=false;status('✓ First cloud backup saved to Supabase. '+configured+' planned exercises protected.');if(!same(local,state))window.cloudScheduleSave?.();
 }catch(e){status('⚠️ First backup could not be completed: '+e.message+'. Your local workout remains unchanged.')}finally{syncing=false}};
window.cloudSaveNow=async()=>{if(!window.cloudGymUser){status('Sign in first.');return}if(blocked){status('⚠️ Sync conflict is paused. Review local and cloud copies before uploading.');return}if(initializing){status('Cloud check in progress. Try again in a moment.');return}if(syncing){status('Upload already running.');return}clearTimeout(queue);status('☁️ Uploading your workout plan…');await autoSave()};
window.cloudScheduleSave=()=>{if(blocked||!window.cloudGymUser)return;clearTimeout(queue);queue=setTimeout(autoSave,1600)};
async function autoSave(){if(syncing||blocked||initializing||!window.cloudGymUser)return;syncing=true;const account=window.cloudGymUser.id,local=copy(state);try{
 const remote=await cloudRow();if(!window.cloudGymUser||window.cloudGymUser.id!==account)return;
 if((remote?.updated_at||null)!==(baseUpdatedAt||null)||(!remote&&cloudRowId)){conflict();return}
 if(remote&&same(local,remote.data.state)){lastCloudState=local;status('✓ Everything is synced.');return}
 const payload={kind:'gym-cloud-snapshot-v1',version:1,savedAt:new Date().toISOString(),state:local};
 let result;if(remote){result=await sb.from('user_settings').update({data:payload,updated_at:new Date().toISOString()}).eq('id',remote.id).eq('user_id',account).eq('updated_at',remote.updated_at).select('id,updated_at').single()}
 else result=await sb.from('user_settings').insert({user_id:account,data:payload}).select('id,updated_at').single();
 if(result.error)throw result.error;
 cloudRowId=result.data.id;baseUpdatedAt=result.data.updated_at;lastCloudState=local;status('✓ Saved automatically to Supabase.');
 if(!same(local,state))window.cloudScheduleSave();
 }catch(e){status('⚠️ Auto-save failed: '+e.message+'. Local test data is still on this device.')}finally{syncing=false}};
window.cloudChangePassword=async()=>{const msg=document.getElementById('cloud-account-message'),form=document.getElementById('cloud-change-password-form');if(!window.cloudGymUser||!msg||!form)return;const first=document.getElementById('cloud-account-new-pass').value,again=document.getElementById('cloud-account-confirm-pass').value;if(first!==again){msg.textContent='Passwords do not match.';return}if(first.length<8){msg.textContent='Use at least 8 characters.';return}const btn=form.querySelector('button');btn.disabled=true;msg.textContent='Updating password…';try{const {error}=await sb.auth.updateUser({password:first});if(error)throw error;form.reset();msg.textContent='✓ Password updated. Your account data remains unchanged.'}catch(e){msg.textContent='Password update failed: '+e.message}finally{btn.disabled=false}};
window.cloudTestDeleteConnection=async()=>{const user=window.cloudGymUser,display=document.getElementById('cloud-delete-message');if(!user||!display)return;display.textContent='Testing secure connection without requesting deletion…';try{const {data:identity,error:authErr}=await sb.auth.getUser();if(authErr||identity?.user?.id!==user.id)throw Error('Please sign in again.');const {data,error}=await sb.functions.invoke('delete-my-account',{body:{confirm:'CONNECTION TEST ONLY',userId:user.id}});let status=error?.context?.status||0;let body=data;if(error?.context?.json){try{body=await error.context.json()}catch(e){}}if(status===400&&body?.error==='Explicit account confirmation required'){display.textContent='✓ Safe connection test passed. Function authenticated this account and rejected the invalid deletion confirmation. No deletion requested.';return}display.textContent='Test result: HTTP '+(status||'unknown')+'; '+(body?.error||error?.message||'Unexpected response')+'. No deletion confirmation was sent. Stop here and share this result.'}catch(e){display.textContent='Connection test failed: '+e.message+'. No deletion confirmation was sent.'}};
window.cloudDeleteAccount=async()=>{const user=window.cloudGymUser,display=document.getElementById('cloud-delete-message');if(!user||!display)return;const email=user.email||'';if(!email){display.textContent='Account email unavailable. Deletion stopped.';return}
const typed=prompt('PERMANENT deletion. Enter the email address of the account to delete exactly:\\n'+email,'');if(typed===null)return;if(typed.trim().toLowerCase()!==email.toLowerCase()){display.textContent='Email did not match. Nothing deleted.';return}
const phrase=prompt('To confirm deletion of this account and ALL its cloud data, type DELETE MY ACCOUNT','');if(phrase!=='DELETE MY ACCOUNT'){display.textContent='Confirmation phrase did not match. Nothing deleted.';return}
if(!confirm('FINAL CONFIRMATION: Permanently delete '+email+' and its cloud records and private photos? This cannot be undone.'))return;
const button=document.querySelector('button[onclick="window.cloudDeleteAccount?.()"]');if(button)button.disabled=true;display.textContent='Requesting deletion from Supabase…';
try{const {data:current,error:sessionError}=await sb.auth.getUser();if(sessionError||current?.user?.id!==user.id)throw new Error('Session changed. Sign in again.');
const {data,error}=await sb.functions.invoke('delete-my-account',{body:{confirm:'DELETE MY ACCOUNT',userId:user.id}});
if(error){let detail=error.message||'Function request failed';if(error.context?.json){try{const response=await error.context.json();if(response?.error)detail=response.error}catch(_){}}throw new Error('HTTP '+(error.context?.status||'unknown')+': '+detail)}
if(!data?.success)throw new Error(data?.error||'Supabase did not confirm deletion.');
clearTimeout(queue);blocked=true;localStorage.removeItem(K);await sb.auth.signOut({scope:'local'});lock();msg('✓ Account permanently deleted. You may register again with the same email address.');document.getElementById('cloud-email').value=email;mode('signup');
}catch(err){display.textContent='Deletion not confirmed: '+(err.message||'Unknown error')+'. Do not retry until the function logs have been checked.'}finally{if(button)button.disabled=false}};
window.cloudLogout=async()=>{clearTimeout(queue);if(!blocked&&!same(state,lastCloudState))await autoSave();const {error}=await sb.auth.signOut();if(error){status(error.message);return}lock()};

let authMode='login',recoveryMode=false;
const authForm=document.getElementById('cloud-login-form'),recoveryForm=document.getElementById('cloud-recovery-form');
function mode(next){authMode=next;document.querySelectorAll('[data-auth-mode]').forEach(b=>b.classList.toggle('active',b.dataset.authMode===next));document.getElementById('cloud-password-label').hidden=next==='reset';document.getElementById('cloud-password').required=next!=='reset';document.getElementById('cloud-password').autocomplete=next==='signup'?'new-password':'current-password';document.getElementById('cloud-auth-submit').textContent=next==='signup'?'Create account':next==='reset'?'Send reset email':'Log in';msg(next==='signup'?'Create an account and confirm your email before signing in.':next==='reset'?'We will email a password reset link if an account exists.':'Use your Supabase account to log in.')}
document.querySelectorAll('[data-auth-mode]').forEach(b=>b.addEventListener('click',()=>mode(b.dataset.authMode)));
function showRecovery(){recoveryMode=true;document.body.classList.add('cloud-locked');document.getElementById('cloud-login-shell').hidden=false;authForm.hidden=true;recoveryForm.hidden=false;document.querySelector('.cloud-auth-modes').hidden=true;msg('Set a new password for your account.')}
authForm.addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('cloud-auth-submit');btn.disabled=true;msg('Please wait…');const email=document.getElementById('cloud-email').value.trim(),password=document.getElementById('cloud-password').value;try{
 let result;
 if(authMode==='signup')result=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
 else if(authMode==='reset')result=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
 else result=await sb.auth.signInWithPassword({email,password});
 if(result.error)throw result.error;
 if(authMode==='login'){scope(result.data.user)}
 else if(authMode==='signup'){if(result.data.session&&result.data.user)scope(result.data.user);else msg('Check your email for a confirmation link. Then return here and log in.')}
 else msg('If an account exists, a reset link has been sent. Check your inbox and spam folder.');
 }catch(err){msg(err.message||'Could not complete the request.')}finally{document.getElementById('cloud-password').value='';btn.disabled=false}});
recoveryForm.addEventListener('submit',async e=>{e.preventDefault();const first=document.getElementById('cloud-new-password').value,second=document.getElementById('cloud-confirm-password').value;if(first!==second){msg('Passwords do not match.');return}if(first.length<8){msg('Use at least eight characters.');return}
 const button=recoveryForm.querySelector('button');button.disabled=true;msg('Updating your password…');try{const {error}=await sb.auth.updateUser({password:first});if(error)throw error;recoveryMode=false;recoveryForm.hidden=true;authForm.hidden=false;document.querySelector('.cloud-auth-modes').hidden=false;document.getElementById('cloud-new-password').value='';document.getElementById('cloud-confirm-password').value='';history.replaceState({},'',location.pathname);const {data}=await sb.auth.getUser();if(data?.user)scope(data.user);else{lock();msg('Password updated. Please log in.')}}catch(err){msg(err.message||'Password update failed.')}finally{button.disabled=false}});
const recoveryRedirect=location.hash.includes('type=recovery')||location.search.includes('type=recovery');
sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY')showRecovery();else if(event==='SIGNED_OUT'&&!recoveryMode)lock()});
const {data,error}=await sb.auth.getUser();if(recoveryRedirect){showRecovery()}else if(data?.user&&!recoveryMode)scope(data.user);else if(!recoveryMode){lock();if(error&&error.name!=='AuthSessionMissingError')msg(error.message)}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&window.cloudGymUser&&!blocked)window.cloudCheck()});
window.addEventListener('online',()=>{if(window.cloudGymUser&&!blocked){window.cloudCheck().then(()=>{if(!same(state,lastCloudState))window.cloudScheduleSave()})}});
setInterval(()=>{if(!document.hidden&&window.cloudGymUser&&!blocked)window.cloudCheck()},45000);
</script></body></html>
